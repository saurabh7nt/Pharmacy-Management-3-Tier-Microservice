apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicine-service-deployment
  labels:
    app: medicine-service

spec:
  replicas: 3
  selector:
    matchLabels:
      app: medicine-service
  template:
    metadata:
      labels:
        app: medicine-service
    spec:
      containers:
      - name: medicine-service
        image: saurabh7nt/microservice-medicine-service:v3
        ports:
          - containerPort: 8082
        env:
          - name: SPRING_DATASOURCE_URL
            value: "jdbc:postgresql://postgres-db-svc:5432/microservices_db"
          - name: SPRING_DATASOURCE_USERNAME
            value: "admin"
          - name: SPRING_DATASOURCE_PASSWORD
            value: "admin123"
          - name: SPRING_JPA_OPEN_IN_VIEW
            value: "false"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
