server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/users/ {
        return 502 "user-service upstream is not configured in this environment\n";
        add_header Content-Type text/plain;
    }

    location /api/medicines/ {
        return 502 "medicine-service upstream is not configured in this environment\n";
        add_header Content-Type text/plain;
    }

    location /api/orders/ {
        return 502 "order-service upstream is not configured in this environment\n";
        add_header Content-Type text/plain;
    }
}
