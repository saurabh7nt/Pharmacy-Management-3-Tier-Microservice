version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: microservices-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: microservices_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/microservices_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_OPEN_IN_VIEW: false
    depends_on:
      - postgres
    restart: unless-stopped

  medicine-service:
    build:
      context: .
      dockerfile: medicine-service/Dockerfile
    container_name: medicine-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/microservices_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_OPEN_IN_VIEW: false
    depends_on:
      - postgres
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/microservices_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_OPEN_IN_VIEW: false
      SERVICES_USER_SERVICE_URL: http://user-service:8081
      SERVICES_MEDICINE_SERVICE_URL: http://medicine-service:8082
    depends_on:
      - postgres
      - user-service
      - medicine-service
    restart: unless-stopped

volumes:
  postgres_data: