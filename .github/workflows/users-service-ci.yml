name: user-service-ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/user-service/**'
      - 'backend/common/**'
      - 'backend/pom.xml'

  pull_request:
    paths:
      - 'backend/user-service/**'
      - 'backend/common/**'
      - 'backend/pom.xml'

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout required code files
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            backend

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd backend
          mvn clean install -pl user-service -am -DskipTests

