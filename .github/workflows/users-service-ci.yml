name: user-service-ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/user-service/**'
      - 'backend/common/**'
      - 'backend/pom.xml'

  pull_request:
    paths:
      - 'backend/user-service/**'
      - 'backend/common/**'
      - 'backend/pom.xml'

jobs:

  git-leaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  trivy-scan:
    name: trivy-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read          # Required to checkout and read repo files
      security-events: write  # Required to upload SARIF files to Security tab
    steps:

    - name: Checkout required code files
      uses: actions/checkout@v6
      with:
        sparse-checkout: |
          backend

    # Fails pipeline on vulnerabilities
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: './backend/user-service'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'

    # Upload findings to GitHub Security tab
    - name: Run Trivy SARIF scan
      uses: aquasecurity/trivy-action@v0.36.0
      if: always()
      with:
        scan-type: 'fs'
        scan-ref: './backend/user-service'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'

  build-test:
    runs-on: ubuntu-latest
    needs: 
      - git-leaks
      - trivy-scan
    steps:
      - name: Checkout required code files
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            backend

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: './backend'
        run: |
          mvn clean install -pl user-service -am -DskipTests

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout required code files
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            backend
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/user-service/Dockerfile
          push: true
          tags: |
            saurabh7nt/user-service:latest
            saurabh7nt/user-service:${{ github.sha }}
