name: order-service-ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/order-service/**'
      - 'backend/common/**'
      - 'backend/pom.xml'

  pull_request:
    paths:
      - 'backend/order-service/**'
      - 'backend/common/**'
      - 'backend/pom.xml'

jobs:

  git-leaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  build-test:
    runs-on: ubuntu-latest
    needs: git-leaks
    steps:
      - name: Checkout required code files
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            backend

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd backend
          mvn clean install -pl order-service -am -DskipTests

